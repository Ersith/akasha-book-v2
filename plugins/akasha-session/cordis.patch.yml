# ⚠ 安装前必改：把 <AKASHA_DIR> / <LOCAL_PATH> 换成你的实际路径（Windows 路径建议用单引号包住）。
#   五个插件都会检测未替换的占位符并**直接报错**（fail closed）——不再静默降级。
#   也可以删掉这些路径字段，改用 AKASHA_DIR 环境变量（插件默认从它推导）。
- insert:
    - id: akasha-session
      name: '@akasha-book/session'
      config:
        log: '<AKASHA_DIR>/logs\hooks.jsonl'
        akashaDir: '<AKASHA_DIR>'
        sessionsRoot: '<LOCAL_PATH>'
        storeFile: '<AKASHA_DIR>/data\session.jsonl'
        metaFile: '<AKASHA_DIR>/data\session-meta.json'
        contextOrder: 134
        minIndexIntervalMs: 30000
